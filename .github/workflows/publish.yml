name: Publish

# Publishes on every push to main, but only a version that is not yet on the target registry —
# so a commit that bumps the version releases it, and any other commit is a harmless no-op.
# Bump with `npm version patch|minor|major` and push. Two registries, one job each, plus a
# GitHub Release per version:
#
# - npm (`claudeleaf` on registry.npmjs.org) — the install source. Authenticates with npm
#   trusted publishing (OIDC): npm trades this job's GitHub identity token for a short-lived
#   publish credential, so there is no NPM_TOKEN secret to store or expire. It needs the trusted
#   publisher configured on npmjs.com (lonetis/claudeleaf, publish.yml), npm >= 11.5.1 (bundled
#   with Node 24), and package.json's repository.url matching this repo, since npm also attaches
#   a provenance attestation.
# - GitHub Packages (`@lonetis/claudeleaf` on npm.pkg.github.com) — a mirror, so the package
#   and its versions show on the repo page. GitHub Packages only accepts owner-scoped names, so
#   the job renames the package before publishing. It authenticates with GITHUB_TOKEN, and the
#   repository field links the package to this repo.
# - GitHub Releases (`vX.Y.Z`) — one per version on npm, tagged at the commit that released it
#   (the first commit on main carrying that version) with auto-generated notes. Every npm
#   version without a release gets one, so missed runs and older versions are backfilled.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: a release build installs fresh from the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build
      - run: npm test # live tests auto-skip without a cached session

      - name: Publish to npm if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping (bump the version to release)."
          else
            echo "Publishing $NAME@$VERSION…"
            npm publish --access public
          fi

  github-packages:
    needs: publish # mirror only a build that passed the tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lonetis" # route only the @lonetis scope there; dependencies stay on npmjs

      - run: npm ci
      - run: npm run build

      - name: Publish to GitHub Packages if the version is new
        run: |
          NAME="@lonetis/claudeleaf"
          npm pkg set name="$NAME"
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on GitHub Packages — skipping."
          else
            echo "Publishing $NAME@$VERSION to GitHub Packages…"
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs: publish # release only what reached npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and releases
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to find the commit each version was released from

      - name: Create a GitHub Release for each npm version that lacks one
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSIONS=$(npm view "$NAME" versions --json | node -p '[].concat(JSON.parse(require("fs").readFileSync(0, "utf8"))).join(" ")')

          # A version's release commit is the first commit on main whose package.json carries it.
          declare -A SHA_OF
          for sha in $(git rev-list --first-parent --reverse HEAD -- package.json); do
            v=$(git show "$sha:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || true)
            if [ -n "$v" ] && [ -z "${SHA_OF[$v]:-}" ]; then SHA_OF[$v]=$sha; fi
          done

          for v in $VERSIONS; do # oldest first, so the newest ends up marked "Latest"
            TAG="v$v"
            if gh release view "$TAG" >/dev/null 2>&1; then continue; fi
            SHA=${SHA_OF[$v]:-}
            if [ -z "$SHA" ]; then
              echo "::warning::No commit on main carries version $v — skipping $TAG."
              continue
            fi
            echo "Creating release $TAG at $SHA…"
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes \
              --notes "Published to npm as [\`$NAME@$v\`](https://www.npmjs.com/package/$NAME/v/$v): \`npm install $NAME@$v\`"
          done
        env:
          GH_TOKEN: ${{ github.token }}
