name: Publish

# Publishes to npm on every push to main, but only when package.json's version is one that
# is not yet on the registry — so a commit that bumps the version releases it, and any other
# commit is a harmless no-op. Bump with `npm version patch|minor|major` and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test # live tests auto-skip without a cached session

      - name: Publish to npm if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping (bump the version to release)."
          else
            echo "Publishing $NAME@$VERSION…"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
