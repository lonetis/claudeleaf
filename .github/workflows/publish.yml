name: Publish

# Publishes to npm on every push to main, but only when package.json's version is one that
# is not yet on the registry — so a commit that bumps the version releases it, and any other
# commit is a harmless no-op. Bump with `npm version patch|minor|major` and push.
#
# Authenticates with npm trusted publishing (OIDC): npm trades this job's GitHub identity token
# for a short-lived publish credential, so there is no NPM_TOKEN secret to store or expire. It
# needs the trusted publisher configured on npmjs.com (lonetis/claudeleaf, publish.yml), npm
# >= 11.5.1 (bundled with Node 24), and package.json's repository.url matching this repo, since
# npm also attaches a provenance attestation.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: a release build installs fresh from the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build
      - run: npm test # live tests auto-skip without a cached session

      - name: Publish to npm if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping (bump the version to release)."
          else
            echo "Publishing $NAME@$VERSION…"
            npm publish --access public
          fi
